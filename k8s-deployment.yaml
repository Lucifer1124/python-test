apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-web-deployment
  labels:
    app: flask-web-app
spec:
  replicas: 3 # Keeps 3 replicas running for high availability
  selector:
    matchLabels:
      app: flask-web-app
  template:
    metadata:
      labels:
        app: flask-web-app
    spec:
      containers:
      - name: flask-web-container
        image: LUCIFER_IMAGE_PLACEHOLDER # Jenkins will replace this with the real image tag
        ports:
        - containerPort: 4000